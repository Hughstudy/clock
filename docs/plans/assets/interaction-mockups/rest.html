<title>Mockup · rest</title><style>/* One stable coordinate system. The sampled rig owns hand/prop contact; CSS
   only supplies small independent ambient rhythms with matching endpoints. */
.scene-rig { pointer-events:none; stroke-linecap:round; stroke-linejoin:round; --scene-blue:#79baf0; --scene-line:#3977af; --scene-ink:#204b72; --scene-pale:#ddf1ff; --scene-wood:#f2d8bd; --scene-edge:#e9bf8b; --scene-green:#aed7be; --scene-paper:#fff8e8; --scene-pink:#ffc3b6; }
.scene-draw-body { fill:var(--scene-coat,var(--scene-blue)); stroke:var(--scene-line); stroke-width:1.5; }
.scene-draw-shade { fill:#5097dc; stroke:var(--scene-line); stroke-width:1.5; }
.scene-draw-belly { fill:var(--scene-belly,var(--scene-pale)); }
.scene-draw-highlight { fill:#b7e0ff; }
.scene-draw-glint { fill:white; }
.scene-draw-line,.scene-draw-softline { fill:none; stroke:var(--scene-line); stroke-width:1.6; }
.scene-draw-softline { stroke-opacity:.65;stroke-width:1.2; }
.scene-draw-ink { fill:var(--scene-ink); }
.scene-draw-face { fill:none;stroke:var(--scene-ink);stroke-width:2.4; }
.scene-draw-pink { fill:var(--scene-pink); }
.scene-draw-shadow { fill:#796e67;opacity:.17; }
.scene-draw-table { fill:var(--scene-wood);stroke:#997d68;stroke-width:1.5; }
.scene-draw-edge { fill:var(--scene-edge);stroke:#9a7960;stroke-width:1.5; }
.scene-draw-green { fill:var(--scene-green);stroke:var(--scene-line);stroke-width:1.5; }
.scene-draw-paper { fill:var(--scene-paper);stroke:var(--scene-line);stroke-width:1.5; }
.scene-draw-water { fill:#d5ecfb;stroke:var(--scene-line);stroke-width:1.4; }
.scene-draw-light { fill:var(--scene-pale);stroke:var(--scene-line);stroke-width:1.4; }
.scene-draw-steam { fill:none;stroke:#6f93b3;stroke-width:2; }
.scene-draw-handle { fill:none;stroke:var(--scene-line);stroke-width:3; }
.scene-draw-pour { fill:none;stroke:#d29e54;stroke-width:2.4; }
.scene-rig [data-scene-part='ground'] .scene-draw-softline { stroke:#ac9985; stroke-opacity:.32; }
.scene-rig-steam { animation:scene-rig-steam 4s ease-in-out infinite; transform-box:fill-box;transform-origin:center bottom; }
.scene-rig[data-scene-part="scene-R2"] .scene-rig-gaze { animation:scene-rig-watch 16s ease-in-out infinite; }
.scene-rig-cloud { animation:scene-rig-cloud 16s ease-in-out infinite; }
.scene-rig-bubble { animation:scene-rig-bubble 8s ease-in-out infinite; }
.scene-rig-star { animation:scene-rig-star 7s ease-in-out infinite; }
/* Keep supports and arm roots fixed: breathing is limited to the face/body
   artwork, below one pixel, and is not applied to hands, tables or held props. */
.scene-rig-breath { animation:scene-rig-breath 5s ease-in-out infinite; transform-origin:120px 164px; }
.scene-rig-eyes { animation:scene-rig-blink 6.8s linear infinite; transform-origin:120px 95px; }
.blue-companion[data-scene-motion='false'] .scene-rig * { animation-play-state:paused; }
.blue-companion[data-static='true'] .scene-rig *, .blue-companion[data-stance='neutral'] .scene-rig * { animation:none!important;transition:none!important; }
@keyframes scene-rig-steam { 0%,100%{translate:0 0;opacity:.65}50%{translate:1px -2px;opacity:.9} }
@keyframes scene-rig-cloud { 0%,100%{translate:0 0}50%{translate:5px 0} }
@keyframes scene-rig-bubble { 0%,100%{translate:0 0}50%{translate:1px -3px} }
@keyframes scene-rig-star { 0%,100%{opacity:.75}50%{opacity:1} }
@keyframes scene-rig-breath { 0%,100%{scale:1 1}50%{scale:1.003 1.004} }
@keyframes scene-rig-blink { 0%,44%,48%,100%{scale:1 1}46%{scale:1 .12} }

@keyframes scene-rig-watch { 0%,100%{translate:0 0}50%{translate:2px 0} }

:root{--safe-top:0px;--safe-bottom:0px;--sky:#cde1db;--cream:#fdf6ea;--line:#ecdcc2;--blue:#6a8fe8;--blue-d:#5276d4;--ink:#34507a;--muted:#8a98ab}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Nunito Variable","Nunito",-apple-system,"PingFang SC",system-ui,sans-serif;color:var(--ink);background:var(--sky)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;position:relative}
button:after{content:"";position:absolute;inset:-6px}
.app{height:100%;display:flex;flex-direction:column}
.scene{position:relative;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;background:var(--sky);overflow:hidden}
.scene svg{display:block;width:100%;height:min(calc(100% - 40px - var(--safe-top)), 96vw);margin-bottom:-14px}
.top{position:absolute;top:calc(var(--safe-top) + 8px);left:12px;right:12px;display:flex;justify-content:flex-end;gap:6px;z-index:2}
.top button{height:30px;min-width:30px;padding:0 11px;border-radius:15px;background:rgba(255,255,255,.75);font-size:12.5px;font-weight:700;color:#5b6f8c}
.bubble{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--safe-top) + 48px);max-width:min(72%,270px);z-index:2;
  background:#fff;border-radius:18px;padding:7px 13px;font-size:13.5px;line-height:1.4;box-shadow:0 2px 8px rgba(60,90,130,.08);text-align:center;color:#4a5f7d}
.bubble:after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:#fff;transform:translateX(-50%) rotate(45deg)}
.plate{position:relative;z-index:1;flex:none;background:var(--cream);border-radius:26px 26px 0 0;box-shadow:0 -4px 14px rgba(120,90,50,.08);padding:12px 18px 12px;text-align:center}
.time{display:flex;align-items:center;justify-content:center;height:44px;margin-top:4px}
.digits{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:44px;min-width:5ch;color:var(--ink)}
.status{height:18px;font-size:12px;color:var(--muted);font-weight:700}
.tone-pause .digits{color:#b08a4a}.tone-done .digits{color:#9aa7b6;font-size:28px}.tone-rest .digits{color:#4f9e86}
.row{height:34px;margin-top:10px;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:6px;justify-content:center}
.chips button{height:30px;padding:0 13px;border-radius:15px;background:#fff;font-weight:700;font-size:13px;color:#5b6f8c;box-shadow:0 0 0 1px #efe3cf}
.chips button.on{background:var(--blue);color:#fff;box-shadow:0 2px 0 var(--blue-d)}
.bar{width:min(220px,70%);height:6px;border-radius:3px;background:#efe3cf;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.tone-pause .bar i{background:repeating-linear-gradient(90deg,#d0a960 0 6px,#ead3a4 6px 9px)}.tone-rest .bar i{background:#6cbca2}
.primary{display:block;margin:12px auto 0;width:min(220px,64%);height:44px;border-radius:22px;background:var(--blue);color:#fff;font-size:16px;font-weight:800;letter-spacing:.5px;
  box-shadow:0 3px 0 var(--blue-d),0 6px 12px rgba(80,120,210,.18)}
.tone-pause .primary{background:#f0a35e;box-shadow:0 3px 0 #d4864a,0 6px 12px rgba(220,140,70,.2)}
.tone-rest .primary{background:#6cbca2;box-shadow:0 3px 0 #4f9e86,0 6px 12px rgba(80,170,140,.2)}
.secondary{display:flex;justify-content:center;gap:14px;margin-top:12px}
.secondary button{height:28px;padding:0 4px;font-size:13px;font-weight:700;color:#7586a0;white-space:nowrap}
.secondary button:before{content:"";display:inline-block;width:6px;height:6px;border-radius:3px;background:#c9d5ea;margin-right:5px;vertical-align:2px}
.tabs{flex:none;display:flex;background:var(--cream);border-top:1px solid #f1e6d4;padding-bottom:var(--safe-bottom)}
.tabs button{flex:1;height:46px;font-size:13px;font-weight:800;color:#a3afbf}.tabs .cur{color:var(--blue)}
.panel{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:#fff;border-radius:22px;padding:14px 16px 12px;box-shadow:0 6px 22px rgba(60,90,130,.16)}
.panel header{display:flex;justify-content:space-between;align-items:center}.panel b{font-size:15px}
.panel .field{margin-top:10px;border:1.5px solid #c7d6f4;border-radius:14px;padding:10px;height:68px;font-size:14px;background:#fbfcff}
.panel .meta{font-size:11.5px;color:var(--muted);margin-top:6px}
.panel p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.panel .actions{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}.panel .actions button{height:36px;padding:0 16px;border-radius:18px;font-weight:800;font-size:14px}
.ghost{background:#f3f5f9;color:#5b6f8c}.solid{background:var(--blue);color:#fff}.ink{background:#4a5f7d;color:#fff}
.panel header .ghost{height:28px;padding:0 10px;border-radius:14px;font-size:12px}
.status .say{display:none}
@media (max-height:700px){.plate{padding:10px 16px 8px}.time{height:38px}.digits{font-size:30px;line-height:38px}.tone-done .digits{font-size:26px}
 .row{margin-top:6px}.primary{margin-top:8px;height:42px}.secondary{margin-top:8px}
 .bubble{display:none}.status.has-say .now{display:none}.status.has-say .say{display:inline;color:#5b7fc4}}
.veil{position:absolute;inset:0;background:rgba(245,248,252,.35);z-index:2}
</style>
