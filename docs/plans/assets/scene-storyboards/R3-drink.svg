<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc"><title id="title">Warm drink — concept storyboard</title><desc id="desc">A side table and coaster provide a resting place; both hands support the warm cup. Four static design frames; not motion performance evidence. Character silhouette derives from the project original companion-spec.json.</desc><style>:root {--background:#f7fbff;--foreground:#204b72;--blue:#79baf0;--orange:#edc19d;--green:#8ab99c;} @media(prefers-color-scheme:dark){:root{--background:#142638;--foreground:#dceeff;--blue:#79baf0;--orange:#edc19d;--green:#8ab99c;}}.sb-art { --sb-blue:color-mix(in srgb,var(--blue) 86%,var(--background)); --sb-pale:color-mix(in srgb,var(--blue) 22%,var(--background)); --sb-shade:color-mix(in srgb,var(--blue) 82%,var(--foreground)); --sb-line:color-mix(in srgb,var(--blue) 48%,var(--foreground)); --sb-ink:var(--foreground); --sb-wood:color-mix(in srgb,var(--orange) 22%,var(--background)); --sb-wood-edge:color-mix(in srgb,var(--orange) 38%,var(--background)); --sb-green:color-mix(in srgb,var(--green) 50%,var(--background)); --sb-paper:color-mix(in srgb,var(--background) 88%,var(--foreground)); --sb-pink:color-mix(in srgb,var(--orange) 48%,var(--background)); --sb-water:color-mix(in srgb,var(--blue) 35%,var(--background)); stroke-linecap:round;stroke-linejoin:round; }
.sb-art .sb-body {fill:var(--sb-blue);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-belly {fill:var(--sb-pale)}
.sb-art .sb-shade {fill:var(--sb-shade);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-line {fill:none;stroke:var(--sb-line);stroke-width:1.6}
.sb-art .sb-softline {fill:none;stroke:var(--sb-line);stroke-width:1.2;opacity:.6}
.sb-art .sb-ink {fill:var(--sb-ink)}
.sb-art .sb-face {fill:none;stroke:var(--sb-ink);stroke-width:2.4}
.sb-art .sb-pink {fill:var(--sb-pink)}
.sb-art .sb-shadow {fill:var(--sb-line);opacity:.12}
.sb-art .sb-table {fill:var(--sb-wood);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-edge {fill:var(--sb-wood-edge);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-green {fill:var(--sb-green);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-paper {fill:var(--sb-paper);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-water {fill:var(--sb-water);stroke:var(--sb-line);stroke-width:1.4}
.sb-art .sb-steam {fill:none;stroke:var(--sb-line);stroke-width:2.1;opacity:.65}
.sb-art .sb-light {fill:var(--sb-pale);stroke:var(--sb-line);stroke-width:1.4}text{fill:var(--foreground);font-family:system-ui,sans-serif;}</style><rect width="1280" height="360" fill="var(--background)"/><text x="18" y="27" font-size="21" font-weight="500">R3 · Warm drink · concept storyboard</text><text x="18" y="49" font-size="14">A side table and coaster provide a resting place; both hands support the warm cup.</text><svg class="sb-art" x="0" y="65" width="320" height="240" viewBox="0 0 320 240"><ellipse class="sb-shadow" cx="160" cy="220" rx="137" ry="10" /><path class="sb-softline" d="M28 220 Q160 235 294 220" /><path class="sb-light" d="M59 196 Q160 184 267 199 L285 217 Q154 238 37 218 Z" /><path class="sb-softline" d="M55 217 Q160 231 271 215" /><path class="sb-light" d="M103 191 Q86 182 91 206 Q151 231 230 209 Q244 191 224 188 Q165 204 103 191Z" /><path class="sb-softline" d="M106 209 Q165 218 219 207" /><g transform="translate(42 38) rotate(0 120 160)"><ellipse class="sb-shadow" cx="120" cy="169" rx="54" ry="5" /><path class="sb-shade" d="M87 151 C78 153 75 161 79 166 C82 171 104 170 108 164 L108 152 Z" /> <path class="sb-shade" d="M135 151 C142 150 158 157 159 164 C159 170 139 171 133 166 L131 156 Z" /> <path class="sb-body" d="M99 44 C80 43 75 29 82 24 C88 18 103 26 111 34 C108 20 115 12 122 17 C129 22 127 33 124 42 Z" /> <path class="sb-body" d="M120 38 C147 37 167 54 173 81 C178 104 185 121 173 143 C163 161 143 165 121 164 C95 166 74 161 64 145 C53 126 62 103 66 82 C71 56 91 39 120 38 Z" /> <path class="sb-belly" d="M82 72 C86 58 99 51 110 50 C99 56 92 64 89 75 C87 79 81 77 82 72 Z" /> <path class="sb-belly" d="M88 133 C90 111 149 107 155 133 C160 153 139 158 122 158 C104 158 85 153 88 133 Z" /> <path class="sb-pink" d="M80 111 C80 105 97 105 97 111 C97 117 80 117 80 111 Z" /> <path class="sb-pink" d="M145 111 C145 105 162 105 162 111 C162 117 145 117 145 111 Z" /><path class="sb-face" d="M94 94 Q100 101 107 94 M134 94 Q141 101 148 94" /><path class="