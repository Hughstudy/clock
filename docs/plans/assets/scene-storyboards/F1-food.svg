<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc"><title id="title">Prepare a little meal — concept storyboard</title><desc id="desc">Vegetables, a rice dish and soup share a compact preparation table. Four static design frames; not motion performance evidence. Character silhouette derives from the project original companion-spec.json.</desc><style>:root {--background:#f7fbff;--foreground:#204b72;--blue:#79baf0;--orange:#edc19d;--green:#8ab99c;} @media(prefers-color-scheme:dark){:root{--background:#142638;--foreground:#dceeff;--blue:#79baf0;--orange:#edc19d;--green:#8ab99c;}}.sb-art { --sb-blue:color-mix(in srgb,var(--blue) 86%,var(--background)); --sb-pale:color-mix(in srgb,var(--blue) 22%,var(--background)); --sb-shade:color-mix(in srgb,var(--blue) 82%,var(--foreground)); --sb-line:color-mix(in srgb,var(--blue) 48%,var(--foreground)); --sb-ink:var(--foreground); --sb-wood:color-mix(in srgb,var(--orange) 22%,var(--background)); --sb-wood-edge:color-mix(in srgb,var(--orange) 38%,var(--background)); --sb-green:color-mix(in srgb,var(--green) 50%,var(--background)); --sb-paper:color-mix(in srgb,var(--background) 88%,var(--foreground)); --sb-pink:color-mix(in srgb,var(--orange) 48%,var(--background)); --sb-water:color-mix(in srgb,var(--blue) 35%,var(--background)); stroke-linecap:round;stroke-linejoin:round; }
.sb-art .sb-body {fill:var(--sb-blue);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-belly {fill:var(--sb-pale)}
.sb-art .sb-shade {fill:var(--sb-shade);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-line {fill:none;stroke:var(--sb-line);stroke-width:1.6}
.sb-art .sb-softline {fill:none;stroke:var(--sb-line);stroke-width:1.2;opacity:.6}
.sb-art .sb-ink {fill:var(--sb-ink)}
.sb-art .sb-face {fill:none;stroke:var(--sb-ink);stroke-width:2.4}
.sb-art .sb-pink {fill:var(--sb-pink)}
.sb-art .sb-shadow {fill:var(--sb-line);opacity:.12}
.sb-art .sb-table {fill:var(--sb-wood);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-edge {fill:var(--sb-wood-edge);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-green {fill:var(--sb-green);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-paper {fill:var(--sb-paper);stroke:var(--sb-line);stroke-width:1.5}
.sb-art .sb-water {fill:var(--sb-water);stroke:var(--sb-line);stroke-width:1.4}
.sb-art .sb-steam {fill:none;stroke:var(--sb-line);stroke-width:2.1;opacity:.65}
